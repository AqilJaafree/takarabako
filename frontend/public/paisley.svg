<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <!-- Gold-foil paisley tile for the Deepavali box lid (app/theme-deepavali-extra.css). Repeats seamlessly. -->
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset="0.45" stop-color="#e8bd6e"/>
      <stop offset="1" stop-color="#a8752f"/>
    </linearGradient>

    <!-- one rosette, centred on 0,0 -->
    <g id="rosette">
      <g fill="none">
        <ellipse rx="3.6" ry="7.5" cy="-10"/>
        <ellipse rx="3.6" ry="7.5" cy="-10" transform="rotate(45)"/>
        <ellipse rx="3.6" ry="7.5" cy="-10" transform="rotate(90)"/>
        <ellipse rx="3.6" ry="7.5" cy="-10" transform="rotate(135)"/>
        <ellipse rx="3.6" ry="7.5" cy="-10" transform="rotate(180)"/>
        <ellipse rx="3.6" ry="7.5" cy="-10" transform="rotate(225)"/>
        <ellipse rx="3.6" ry="7.5" cy="-10" transform="rotate(270)"/>
        <ellipse rx="3.6" ry="7.5" cy="-10" transform="rotate(315)"/>
        <circle r="5.5"/>
      </g>
      <circle r="2.2" fill="url(#foil)" stroke="none"/>
    </g>

    <!-- a small curl -->
    <path id="swirl" fill="none" d="M0 0c3-6 12-6 13 0 1 5-5 7-7 3-1-2 1-4 3-3"/>

    <!-- a paisley (boteh): round belly at the bottom, the tip curling over at the top -->
    <g id="paisley">
      <path fill="none" stroke-width="2.2" d="M55 18C40 30 45 50 30 65 10 85 15 130 50 130 85 130 92 95 80 75 70 58 62 40 55 18Z"/>
      <path fill="none" stroke-width="2.2" d="M55 18C57 7 73 6 74 17 75 26 64 28 63 21"/>
      <!-- dotted halo -->
      <path fill="none" stroke-width="2.4" stroke-dasharray="0 6" stroke-linecap="round" d="M52 8C34 24 38 46 23 61 0 85 8 139 50 139 93 139 101 96 87 71 76 52 69 30 60 9"/>
      <!-- inner outline -->
      <path fill="none" stroke-width="1.3" d="M54 34C46 46 47 60 37 72 25 88 28 120 50 120 74 120 80 97 72 82 64 68 59 52 54 34Z"/>
      <!-- sweeping lines filling the neck -->
      <path fill="none" stroke-width="1.1" d="M54 40C52 56 46 66 42 78M56 46C57 60 54 70 52 80M58 54C62 64 63 72 62 82"/>
      <g transform="translate(50 101) scale(1.05)"><use xlink:href="#rosette"/></g>
    </g>
  </defs>

  <g stroke="url(#foil)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- paisley leaning right, and one turned over beside it -->
    <use xlink:href="#paisley" transform="translate(4 -10) rotate(-12 50 75)"/>
    <use xlink:href="#paisley" transform="translate(124 108) rotate(168 50 75) scale(1)"/>
    <!-- the same two wrapped around the edges so the tile repeats -->
    <use xlink:href="#paisley" transform="translate(4 230) rotate(-12 50 75)"/>
    <use xlink:href="#paisley" transform="translate(-116 108) rotate(168 50 75)"/>
    <use xlink:href="#paisley" transform="translate(124 -132) rotate(168 50 75)"/>

    <!-- rosettes and curls in the gaps -->
    <g transform="translate(176 40) scale(1.25)"><use xlink:href="#rosette"/></g>
    <g transform="translate(60 196) scale(1.1)"><use xlink:href="#rosette"/></g>
    <g transform="translate(118 128) scale(0.7)"><use xlink:href="#rosette"/></g>
    <g transform="translate(214 150) scale(0.6)"><use xlink:href="#rosette"/></g>
    <use xlink:href="#swirl" transform="translate(130 10)"/>
    <use xlink:href="#swirl" transform="translate(206 92) rotate(160)"/>
    <use xlink:href="#swirl" transform="translate(16 160) rotate(30)"/>
    <use xlink:href="#swirl" transform="translate(110 222) rotate(-20)"/>
    <circle cx="150" cy="70" r="1.8" fill="url(#foil)" stroke="none"/>
    <circle cx="96" cy="160" r="1.8" fill="url(#foil)" stroke="none"/>
    <circle cx="228" cy="210" r="1.8" fill="url(#foil)" stroke="none"/>
    <circle cx="20" cy="104" r="1.8" fill="url(#foil)" stroke="none"/>
  </g>
</svg>
